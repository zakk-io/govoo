name: Deploy to demo server

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-remote
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 209.95.52.121
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            bash /opt/govoo/repo/deploy/remote_deploy.sh
